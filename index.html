<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>Gaben Codex</title>
  <link rel="icon" type="image/jpeg" href="ikon.jpg" />
  <link rel="apple-touch-icon" href="ikon.jpg" />
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155; --input: #0f172a;
      --text: #f8fafc; --muted: #94a3b8; --primary: #3b82f6; --gold: #f59e0b;
      --win: #10b981; --loss: #ef4444;
      --eternity: #c4b5fd; --nature: #4ade80; --honor: #bae6fd;
      --chaos: #fb7185; --progress: #38bdf8; --mystery: #e879f9;
      --water: #38bdf8; --fire: #fb7185; --earth: #4ade80;
      --light: #fde047; --darkness: #a855f7; --elarite: #2dd4bf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 85px; }
    .container { max-width: 600px; margin: 0 auto; padding: 14px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .app-title { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .app-title img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }
    .title-text h1 { font-size: 1.15rem; font-weight: 800; line-height: 1.1; }
    .guild-subtitle { font-size: 0.75rem; color: var(--gold); font-weight: 700; margin-top: 2px; }
    .backup-btns { display: flex; gap: 5px; }
    .btn-small { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 6px 9px; border-radius: 8px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
    .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; background: var(--card); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .mode-tab { background: none; border: none; color: var(--muted); padding: 9px; border-radius: 9px; font-size: 0.9rem; font-weight: 800; cursor: pointer; }
    .mode-tab.active { background: var(--primary); color: #fff; }
    .search-box { position: relative; margin-bottom: 12px; }
    .search-box input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 11px 36px 11px 14px; border-radius: 10px; font-size: 0.95rem; outline: none; }
    .clear-search { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; display: none; }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .quick-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 10px; border-radius: 12px; font-size: 0.88rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .quick-btn.team-check { background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(16,185,129,0.18)); border-color: rgba(59,130,246,0.5); }
    .quick-btn.fav-btn { border-color: rgba(245,158,11,0.45); }
    .all-factions-btn { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; }
    .faction-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .faction-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px 14px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 82px; }
    .faction-name { font-size: 1.02rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .faction-count { font-size: 0.76rem; color: var(--muted); margin-top: 5px; font-weight: 600; }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-header h2 { font-size: 1.15rem; font-weight: 800; }
    .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hero-item { background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 11px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    .hero-item-name { font-weight: 700; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hero-badges { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .star-mini { color: var(--gold); font-size: 0.85rem; }
    .note-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--win); }
    .detail-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .detail-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 14px; }
    .detail-hero-name { font-size: 1.35rem; font-weight: 800; }
    .detail-faction-label { font-size: 0.78rem; color: var(--muted); margin-top: 2px; font-weight: 600; }
    .star-toggle { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.4); color: var(--gold); padding: 6px 11px; border-radius: 10px; font-size: 1.15rem; cursor: pointer; }
    .info-block { margin-bottom: 13px; }
    .info-block:last-child { margin-bottom: 0; }
    .info-label { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
    .info-content { background: rgba(15, 23, 42, 0.55); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; color: #e2e8f0; line-height: 1.5; white-space: pre-wrap; min-height: 38px; }
    .info-empty { color: #64748b; font-style: italic; }
    .hero-link { font-weight: 700; text-decoration: underline; cursor: pointer; }
    .backlink-row { margin-bottom: 5px; font-size: 0.86rem; }
    .backlink-tag { color: var(--muted); font-size: 0.75rem; font-weight: 700; }
    .tc-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .tc-subtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; background: var(--input); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
    .tc-subtab { background: none; border: none; color: var(--muted); padding: 8px 6px; border-radius: 7px; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
    .tc-subtab.active { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .tc-inputs { display: grid; grid-template-columns: 1fr; gap: 7px; margin: 10px 0 4px; }
    .tc-result-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .tc-result-card.good { border-color: rgba(16,185,129,0.45); }
    .tc-result-card.bad { border-color: rgba(239,68,68,0.45); }
    .tc-result-card.syn { border-color: rgba(59,130,246,0.45); }
    .tc-title { font-size: 0.88rem; font-weight: 800; margin-bottom: 8px; }
    .tc-title.good { color: var(--win); }
    .tc-title.bad { color: var(--loss); }
    .tc-title.syn { color: #60a5fa; }
    .tc-chip { display: inline-flex; align-items: center; gap: 5px; background: rgba(15,23,42,0.7); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; margin: 0 6px 6px 0; font-size: 0.84rem; font-weight: 700; cursor: pointer; }
    .tc-chip.fav { border-color: var(--gold); background: rgba(245,158,11,0.12); }
    .tc-count-badge { background: rgba(239,68,68,0.25); color: #fca5a5; padding: 1px 5px; border-radius: 5px; font-size: 0.72rem; font-weight: 800; }
    .tc-reason { font-size: 0.72rem; color: var(--muted); font-weight: 500; }
    .syn-pair { background: rgba(15,23,42,0.65); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 0.85rem; }
    .fab { position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 560px; margin: 0 auto; background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 14px; font-size: 1rem; font-weight: 700; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); cursor: pointer; z-index: 10; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); display: none; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 12px; z-index: 50; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 560px; padding: 16px; margin-bottom: 30px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .close-modal { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    input[type="text"], select, textarea { width: 100%; background: var(--input); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; font-size: 0.92rem; outline: none; font-family: inherit; }
    textarea { min-height: 66px; resize: vertical; }
    .save-btn { width: 100%; background: var(--win); color: #052e16; border: none; padding: 13px; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 6px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="app-title" onclick="goHome()">
      <img src="ikon.jpg" alt="Icon" onerror="this.style.display='none'" />
      <div class="title-text">
        <h1>Gaben Codex</h1>
        <div class="guild-subtitle">⚔️ Chilligan's Tavern</div>
      </div>
    </div>
    <div class="backup-btns">
      <button class="btn-small" onclick="exportJSON()">Export</button>
      <button class="btn-small" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)" />
    </div>
  </header>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tabHeroes" onclick="switchEntityMode('heroes')">🦸 Heroes</button>
    <button class="mode-tab" id="tabTitans" onclick="switchEntityMode('titans')">🗿 Titans</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search name, synergy or counter..." oninput="handleSearch()" />
    <button class="clear-search" id="clearSearchBtn" onclick="clearSearch()">✕</button>
  </div>

  <div id="mainView"></div>
</div>

<button class="fab" id="fabBtn" onclick="openEntryModal()">+ Add Hero</button>

<div class="modal-overlay" id="entryModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Edit</h2>
      <button class="close-modal" onclick="closeModal()">✕</button>
    </div>
    <form id="entryForm" onsubmit="saveEntry(event)">
      <input type="hidden" id="editId" />
      <div class="form-group">
        <label id="nameLabel">Hero Name</label>
        <input type="text" id="nameInput" required />
      </div>
      <div class="form-group">
        <label id="groupLabel">Faction</label>
        <select id="groupInput" required></select>
      </div>
      <div class="form-group">
        <label>🤝 Synergies (Works well with)</label>
        <textarea id="synergyInput" placeholder="Who works well in the same team?"></textarea>
      </div>
      <div class="form-group">
        <label>⚔️ Strong Against (Counters)</label>
        <textarea id="strongInput" placeholder="Who does this unit beat?"></textarea>
      </div>
      <div class="form-group">
        <label>🛡️ Counters / Weak Against</label>
        <textarea id="counterInput" placeholder="Who beats this unit?"></textarea>
      </div>
      <div class="form-group">
        <label>📝 Notes (Skins, Artifacts, Tips)</label>
        <textarea id="notesInput" placeholder="Optional build notes..."></textarea>
      </div>
      <button type="submit" class="save-btn">Save</button>
    </form>
  </div>
</div>
<datalist id="activeDatalist"></datalist>
<script>
  const HEROES_KEY = 'gaben_codex_v1';
  const TITANS_KEY = 'gaben_codex_titans_v1';

  const HERO_GROUPS = [
    { id: 'Eternity', icon: '☥', color: '#c4b5fd' },
    { id: 'Nature',   icon: '🍃', color: '#4ade80' },
    { id: 'Honor',    icon: '🪽', color: '#bae6fd' },
    { id: 'Chaos',    icon: '👹', color: '#fb7185' },
    { id: 'Progress', icon: '⚙️', color: '#38bdf8' },
    { id: 'Mystery',  icon: '🔥', color: '#e879f9' }
  ];

  const TITAN_GROUPS = [
    { id: 'Water',    icon: '💧', color: '#38bdf8' },
    { id: 'Fire',     icon: '🔥', color: '#fb7185' },
    { id: 'Earth',    icon: '🌿', color: '#4ade80' },
    { id: 'Light',    icon: '☀️', color: '#fde047' },
    { id: 'Darkness', icon: '🌑', color: '#a855f7' },
    { id: 'Elarite',  icon: '✨', color: '#2dd4bf' }
  ];

  const DEFAULT_HEROES = [
    { name: 'Iris', faction: 'Eternity' }, { name: 'Electra von Grave', faction: 'Eternity' },
    { name: 'Tempus', faction: 'Eternity' }, { name: 'Drayne', faction: 'Eternity' },
    { name: 'Dante', faction: 'Eternity' }, { name: 'Octavia', faction: 'Eternity' },
    { name: 'Phobos', faction: 'Eternity' }, { name: 'Faceless', faction: 'Eternity' },
    { name: 'Corvus', faction: 'Eternity' }, { name: 'Morrigan', faction: 'Eternity' },
    { name: 'Byrna', faction: 'Nature' }, { name: 'Yasmine', faction: 'Nature' },
    { name: 'Leonel', faction: 'Nature' }, { name: 'Mushy and Shroom', faction: 'Nature' },
    { name: 'Wodryn', faction: 'Nature' }, { name: 'Oya', faction: 'Nature' },
    { name: 'Alvanor', faction: 'Nature' }, { name: 'Mojo', faction: 'Nature' },
    { name: 'Maya', faction: 'Nature' }, { name: 'Aurora', faction: 'Nature' },
    { name: 'Crow', faction: 'Honor' }, { name: 'Soleil', faction: 'Honor' },
    { name: 'Guus', faction: 'Honor' }, { name: 'Artemis', faction: 'Honor' },
    { name: 'Qing Mao', faction: 'Honor' }, { name: 'Fafnir', faction: 'Honor' },
    { name: 'Galahad', faction: 'Honor' }, { name: 'Tristan', faction: 'Honor' },
    { name: 'Markus', faction: 'Honor' }, { name: 'Luther', faction: 'Honor' },
    { name: 'Peech', faction: 'Chaos' }, { name: 'Aidan', faction: 'Chaos' },
    { name: 'Cleaver', faction: 'Chaos' }, { name: 'Astaroth', faction: 'Chaos' },
    { name: 'Jorgen', faction: 'Chaos' }, { name: 'Kayla', faction: 'Chaos' },
    { name: 'Dorian', faction: 'Chaos' }, { name: "Xe'Sha", faction: 'Chaos' },
    { name: 'Lilith', faction: 'Chaos' }, { name: 'Kai', faction: 'Chaos' },
    { name: 'Nebula', faction: 'Progress' }, { name: 'Julius', faction: 'Progress' },
    { name: 'Polaris', faction: 'Progress' }, { name: 'Orion', faction: 'Progress' },
    { name: 'Eva', faction: 'Progress' }, { name: 'Judge', faction: 'Progress' },
    { name: 'Sebastian', faction: 'Progress' }, { name: 'Isaac', faction: 'Progress' },
    { name: 'Astrid and Lucas', faction: 'Progress' }, { name: 'Arachne', faction: 'Progress' },
    { name: 'Folio', faction: 'Mystery' }, { name: 'Miu', faction: 'Mystery' },
    { name: 'Satori', faction: 'Mystery' }, { name: 'Somna', faction: 'Mystery' },
    { name: 'Cascade', faction: 'Mystery' }, { name: 'Amira', faction: 'Mystery' },
    { name: 'Heidi', faction: 'Mystery' }, { name: 'Andvari', faction: 'Mystery' },
    { name: 'Martha', faction: 'Mystery' }, { name: 'Rufus', faction: 'Mystery' }
  ];

  const DEFAULT_TITANS = [
    { name: 'Sigurd', faction: 'Water' }, { name: 'Nova', faction: 'Water' },
    { name: 'Mairi', faction: 'Water' }, { name: 'Hyperion', faction: 'Water' },
    { name: 'Tydus', faction: 'Water' },
    { name: 'Moloch', faction: 'Fire' }, { name: 'Vulcan', faction: 'Fire' },
    { name: 'Ignis', faction: 'Fire' }, { name: 'Araji', faction: 'Fire' },
    { name: 'Asherona', faction: 'Fire' },
    { name: 'Angus', faction: 'Earth' }, { name: 'Sylva', faction: 'Earth' },
    { name: 'Avalon', faction: 'Earth' }, { name: 'Eden', faction: 'Earth' },
    { name: 'Verdoc', faction: 'Earth' },
    { name: 'Rigel', faction: 'Light' }, { name: 'Amon', faction: 'Light' },
    { name: 'Iyari', faction: 'Light' }, { name: 'Solaris', faction: 'Light' },
    { name: 'Lumira', faction: 'Light' },
    { name: 'Brustar', faction: 'Darkness' }, { name: 'Keros', faction: 'Darkness' },
    { name: 'Mort', faction: 'Darkness' }, { name: 'Tenebris', faction: 'Darkness' },
    { name: 'Umbra', faction: 'Darkness' },
    { name: 'Metida', faction: 'Elarite' }, { name: 'Orm', faction: 'Elarite' },
    { name: 'Alecto', faction: 'Elarite' }, { name: 'Pallant', faction: 'Elarite' }
  ];

  let heroes = JSON.parse(localStorage.getItem(HEROES_KEY) || 'null');
  if (!heroes) {
    heroes = DEFAULT_HEROES.map((h, i) => ({ id: 'h_' + (i + 1), name: h.name, faction: h.faction, fav: false, synergy: '', strong: '', counter: '', notes: '' }));
    localStorage.setItem(HEROES_KEY, JSON.stringify(heroes));
  }

  let titans = JSON.parse(localStorage.getItem(TITANS_KEY) || 'null');
  if (!titans) {
    titans = DEFAULT_TITANS.map((t, i) => ({ id: 't_' + (i + 1), name: t.name, faction: t.faction, fav: false, synergy: '', strong: '', counter: '', notes: '' }));
    localStorage.setItem(TITANS_KEY, JSON.stringify(titans));
  }

  let entityMode = 'heroes'; // 'heroes' | 'titans'
  let viewMode = 'home';     // 'home' | 'group' | 'detail' | 'teamcheck'
  let tcSubMode = 'enemy';   // 'enemy' | 'builder'
  let activeGroup = 'All';
  let activeEntryId = null;
  let tcSlots = ['', '', '', '', ''];

  function getActiveList() { return entityMode === 'heroes' ? heroes : titans; }
  function getActiveGroups() { return entityMode === 'heroes' ? HERO_GROUPS : TITAN_GROUPS; }
  function saveCurrent() {
    if (entityMode === 'heroes') localStorage.setItem(HEROES_KEY, JSON.stringify(heroes));
    else localStorage.setItem(TITANS_KEY, JSON.stringify(titans));
    updateDatalist();
    render();
  }
  function updateDatalist() {
    const dl = document.getElementById('activeDatalist');
    if (!dl) return;
    dl.innerHTML = [...getActiveList()].sort((a, b) => a.name.localeCompare(b.name))
      .map(x => `<option value="${escapeHtml(x.name)}">`).join('');
  }
  function getGroupColor(gName) {
    const g = getActiveGroups().find(x => x.id === gName);
    return g ? g.color : '#f8fafc';
  }
  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function textMentions(text, name) {
    if (!text || !name) return false;
    const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp(`\\b${esc}\\b`, 'i').test(text);
  }
  function linkify(text, currentId) {
    if (!text || !text.trim()) return `<span class="info-empty">No notes added yet. Tap Edit to add.</span>`;
    let safe = escapeHtml(text);
    const sorted = [...getActiveList()].filter(x => x.id !== currentId).sort((a, b) => b.name.length - a.name.length);
    sorted.forEach(x => {
      const escName = escapeHtml(x.name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`\\b(${escName})\\b`, 'gi');
      safe = safe.replace(regex, `<span class="hero-link" style="color:${getGroupColor(x.faction)}" onclick="openDetail('${x.id}')">$1</span>`);
    });
    return safe;
  }
  function getLinkedMentions(target) {
    const links = [];
    getActiveList().forEach(other => {
      if (other.id === target.id) return;
      if (textMentions(other.counter, target.name)) links.push({ item: other, label: 'Strong against (from their Weaknesses)' });
      if (textMentions(other.strong, target.name)) links.push({ item: other, label: 'Weak against (counters you)' });
      if (textMentions(other.synergy, target.name)) links.push({ item: other, label: 'Synergy partner' });
    });
    return links;
  }
  function switchEntityMode(m) {
    entityMode = m;
    document.getElementById('tabHeroes').classList.toggle('active', m === 'heroes');
    document.getElementById('tabTitans').classList.toggle('active', m === 'titans');
    document.getElementById('fabBtn').textContent = m === 'heroes' ? '+ Add Hero' : '+ Add Titan';
    tcSlots = ['', '', '', '', ''];
    updateDatalist();
    goHome();
  }
  function toggleFav(id) {
    const item = getActiveList().find(x => x.id === id);
    if (!item) return;
    item.fav = !item.fav;
    saveCurrent();
  }
  function goHome() {
    viewMode = 'home';
    activeEntryId = null;
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
    render();
  }
  function openGroup(gName) {
    viewMode = 'group';
    activeGroup = gName;
    activeEntryId = null;
    render();
  }
  function openTeamCheck(sub = 'enemy') {
    viewMode = 'teamcheck';
    tcSubMode = sub;
    activeEntryId = null;
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
    render();
  }
  function switchTcSubMode(sub) {
    tcSubMode = sub;
    render();
  }
  function openDetail(id) {
    viewMode = 'detail';
    activeEntryId = id;
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
    render();
    window.scrollTo(0, 0);
  }
  function handleSearch() {
    const v = document.getElementById('searchInput').value;
    document.getElementById('clearSearchBtn').style.display = v ? 'block' : 'none';
    render();
  }
  function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
    render();
  }
  function hasNotes(x) {
    return Boolean((x.synergy && x.synergy.trim()) || (x.strong && x.strong.trim()) || (x.counter && x.counter.trim()) || (x.notes && x.notes.trim()));
  }
  function updateTcSlot(idx, val) {
    tcSlots[idx] = val;
    renderTeamCheckResults();
  }
  function clearTcSlots() {
    tcSlots = ['', '', '', '', ''];
    render();
  }
  function renderTeamCheckResults() {
    const resEl = document.getElementById('tcResults');
    if (!resEl) return;
    const list = getActiveList();
    const picked = tcSlots.map(n => list.find(x => x.name.toLowerCase() === n.trim().toLowerCase())).filter(Boolean);

    if (picked.length === 0) {
      resEl.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:0.86rem; padding:16px;">Select up to 5 ${entityMode} above to analyze!</div>`;
      return;
    }

    if (tcSubMode === 'enemy') {
      const goodMap = new Map(), badMap = new Map();
      picked.forEach(enemy => {
        list.forEach(cand => {
          if (cand.id === enemy.id) return;
          if (textMentions(cand.strong, enemy.name) || textMentions(enemy.counter, cand.name)) {
            if (!goodMap.has(cand.id)) goodMap.set(cand.id, { item: cand, reasons: [] });
            goodMap.get(cand.id).reasons.push(`vs ${enemy.name}`);
          }
          if (textMentions(cand.counter, enemy.name) || textMentions(enemy.strong, cand.name)) {
            if (!badMap.has(cand.id)) badMap.set(cand.id, { item: cand, reasons: [] });
            badMap.get(cand.id).reasons.push(`by ${enemy.name}`);
          }
        });
      });
      const goodList = Array.from(goodMap.values()).sort((a, b) => (b.item.fav ? 1 : 0) - (a.item.fav ? 1 : 0) || b.reasons.length - a.reasons.length);
      const badList = Array.from(badMap.values()).sort((a, b) => (b.item.fav ? 1 : 0) - (a.item.fav ? 1 : 0));

      resEl.innerHTML = `
        <div class="tc-result-card good">
          <div class="tc-title good">✅ Recommended Counters (${goodList.length})</div>
          ${goodList.length ? goodList.map(r => `
            <div class="tc-chip ${r.item.fav ? 'fav' : ''}" onclick="openDetail('${r.item.id}')">
              ${r.item.fav ? '<span>⭐</span>' : ''}
              <span style="color:${getGroupColor(r.item.faction)}">${escapeHtml(r.item.name)}</span>
              <span class="tc-reason">(${escapeHtml(r.reasons.join(', '))})</span>
            </div>`).join('') : '<div style="color:var(--muted); font-size:0.84rem;">No counters logged yet for these enemies.</div>'}
        </div>
        <div class="tc-result-card bad">
          <div class="tc-title bad">⚠️ Avoid / Weak Against (${badList.length})</div>
          ${badList.length ? badList.map(r => `
            <div class="tc-chip ${r.item.fav ? 'fav' : ''}" onclick="openDetail('${r.item.id}')">
              ${r.item.fav ? '<span>⭐</span>' : ''}
              <span style="color:${getGroupColor(r.item.faction)}">${escapeHtml(r.item.name)}</span>
              <span class="tc-reason">(${escapeHtml(r.reasons.join(', '))})</span>
            </div>`).join('') : '<div style="color:var(--muted); font-size:0.84rem;">No weaknesses logged against this lineup.</div>'}
        </div>`;
    } else {
      // My Team Builder: Synergies within team + Shared Threats against team
      const synPairs = [];
      for (let i = 0; i < picked.length; i++) {
        for (let j = i + 1; j < picked.length; j++) {
          const a = picked.at(i), b = picked.at(j);
          if (textMentions(a.synergy, b.name) || textMentions(b.synergy, a.name)) {
            synPairs.push({ a, b });
          }
        }
      }
      const threatMap = new Map();
      picked.forEach(ally => {
        list.forEach(threat => {
          if (picked.some(p => p.id === threat.id)) return;
          if (textMentions(ally.counter, threat.name) || textMentions(threat.strong, ally.name)) {
            if (!threatMap.has(threat.id)) threatMap.set(threat.id, { item: threat, hits: [] });
            threatMap.get(threat.id).hits.push(ally.name);
          }
        });
      });
      const threats = Array.from(threatMap.values()).sort((a, b) => b.hits.length - a.hits.length);

      resEl.innerHTML = `
        <div class="tc-result-card syn">
          <div class="tc-title syn">🤝 Active Team Synergies (${synPairs.length})</div>
          ${synPairs.length ? synPairs.map(p => `
            <div class="syn-pair">
              <span class="hero-link" style="color:${getGroupColor(p.a.faction)}" onclick="openDetail('${p.a.id}')">${escapeHtml(p.a.name)}</span>
              <span style="color:var(--muted);"> + </span>
              <span class="hero-link" style="color:${getGroupColor(p.b.faction)}" onclick="openDetail('${p.b.id}')">${escapeHtml(p.b.name)}</span>
            </div>`).join('') : '<div style="color:var(--muted); font-size:0.84rem;">No direct synergies logged between these picks yet.</div>'}
        </div>
        <div class="tc-result-card bad">
          <div class="tc-title bad">⚠️ Shared Threats / Big Enemies (${threats.length})</div>
          ${threats.length ? threats.map(t => `
            <div class="tc-chip" onclick="openDetail('${t.item.id}')">
              ${t.hits.length > 1 ? `<span class="tc-count-badge">${t.hits.length}x</span>` : ''}
              <span style="color:${getGroupColor(t.item.faction)}">${escapeHtml(t.item.name)}</span>
              <span class="tc-reason">(counters ${escapeHtml(t.hits.join(', '))})</span>
            </div>`).join('') : '<div style="color:var(--muted); font-size:0.84rem;">No major threats logged against this team yet.</div>'}
        </div>`;
    }
  }
  function render() {
    const container = document.getElementById('mainView');
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const listAll = getActiveList();
    const groups = getActiveGroups();
    const unitPlural = entityMode === 'heroes' ? 'heroes' : 'titans';
    const groupWord = entityMode === 'heroes' ? 'Factions' : 'Elements';

    if (q) {
      const matches = listAll.filter(x =>
        [x.name, x.faction, x.synergy, x.strong, x.counter, x.notes].join(' ').toLowerCase().includes(q)
      ).sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || a.name.localeCompare(b.name));

      container.innerHTML = `
        <div class="section-header"><h2>Search Results (${matches.length})</h2></div>
        <div class="hero-grid">
          ${matches.map(x => `
            <div class="hero-item" onclick="openDetail('${x.id}')">
              <span class="hero-item-name" style="color:${getGroupColor(x.faction)}">${escapeHtml(x.name)}</span>
              <div class="hero-badges">
                ${x.fav ? '<span class="star-mini">⭐</span>' : ''}
                ${hasNotes(x) ? '<span class="note-dot"></span>' : ''}
              </div>
            </div>`).join('')}
        </div>`;
      return;
    }

    if (viewMode === 'home') {
      const favCount = listAll.filter(x => x.fav).length;
      container.innerHTML = `
        <div class="quick-actions">
          <button class="quick-btn team-check" onclick="openTeamCheck('enemy')">
            <span>⚔️ Team Check</span>
            <span style="color:var(--muted);">›</span>
          </button>
          <button class="quick-btn fav-btn" onclick="openGroup('Favorites')">
            <span>⭐ Core ${entityMode === 'heroes' ? 'Heroes' : 'Titans'}</span>
            <span style="color:var(--gold);">${favCount} ›</span>
          </button>
        </div>
        <button class="all-factions-btn" onclick="openGroup('All')">
          <span>▦ All ${groupWord}</span>
          <span style="color:var(--muted); font-size:0.85rem;">${listAll.length} ${unitPlural} ›</span>
        </button>
        <div class="faction-grid">
          ${groups.map(g => {
            const count = listAll.filter(x => x.faction === g.id).length;
            return `
              <div class="faction-card" style="border-color:${g.color}44" onclick="openGroup('${g.id}')">
                <div class="faction-name" style="color:${g.color}">${g.icon} ${g.id}</div>
                <div class="faction-count">${count} ${unitPlural}</div>
              </div>`;
          }).join('')}
        </div>`;
      return;
    }

    if (viewMode === 'teamcheck') {
      const labelSlot = entityMode === 'heroes' ? 'Hero' : 'Titan';
      const slotsHtml = Array.from({ length: 5 }, (_, i) => `
        <input type="text" list="activeDatalist" placeholder="${tcSubMode === 'enemy' ? 'Enemy' : 'My'} ${labelSlot} ${i + 1}" value="${escapeHtml(tcSlots.at(i))}" oninput="updateTcSlot(${i}, this.value)" />
      `).join('');

      container.innerHTML = `
        <div class="nav-bar">
          <button class="back-btn" onclick="goHome()">← Back</button>
          <button class="btn-small" onclick="clearTcSlots()">Clear</button>
        </div>
        <div class="tc-box">
          <div class="tc-subtabs">
            <button class="tc-subtab ${tcSubMode === 'enemy' ? 'active' : ''}" onclick="switchTcSubMode('enemy')">⚔️ Counter Enemy</button>
            <button class="tc-subtab ${tcSubMode === 'builder' ? 'active' : ''}" onclick="switchTcSubMode('builder')">🛡️ My Team Builder</button>
          </div>
          <p style="font-size:0.78rem; color:var(--muted);">
            ${tcSubMode === 'enemy' ? `Enter up to 5 enemy ${unitPlural} to find counters & warnings:` : `Enter up to 5 allied ${unitPlural} to check synergies & big enemies:`}
          </p>
          <div class="tc-inputs">${slotsHtml}</div>
        </div>
        <div id="tcResults"></div>`;
      renderTeamCheckResults();
      return;
    }

    if (viewMode === 'group') {
      let list;
      if (activeGroup === 'All') list = [...listAll];
      else if (activeGroup === 'Favorites') list = listAll.filter(x => x.fav);
      else list = listAll.filter(x => x.faction === activeGroup);

      list.sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || a.name.localeCompare(b.name));
      const gColor = activeGroup === 'Favorites' ? '#f59e0b' : (activeGroup === 'All' ? '#f8fafc' : getGroupColor(activeGroup));
      const titleText = activeGroup === 'Favorites' ? `⭐ Core ${entityMode === 'heroes' ? 'Heroes' : 'Titans'}` : activeGroup;

      container.innerHTML = `
        <div class="nav-bar">
          <button class="back-btn" onclick="goHome()">← ${groupWord}</button>
          <span style="font-size:0.8rem; color:var(--muted);">${list.length} ${unitPlural}</span>
        </div>
        <div class="section-header"><h2 style="color:${gColor}">${escapeHtml(titleText)}</h2></div>
        ${list.length === 0 ? `<div style="text-align:center; color:var(--muted); padding:30px;">No ${unitPlural} here yet. Open any entry and tap ☆ to star your favorites!</div>` : `
          <div class="hero-grid">
            ${list.map(x => `
              <div class="hero-item" onclick="openDetail('${x.id}')">
                <span class="hero-item-name" style="color:${getGroupColor(x.faction)}">${escapeHtml(x.name)}</span>
                <div class="hero-badges">
                  ${x.fav ? '<span class="star-mini">⭐</span>' : ''}
                  ${hasNotes(x) ? '<span class="note-dot"></span>' : ''}
                </div>
              </div>`).join('')}
          </div>`}`;
      return;
    }

    if (viewMode === 'detail') {
      const item = listAll.find(x => x.id === activeEntryId);
      if (!item) { goHome(); return; }
      const gColor = getGroupColor(item.faction);
      const backLinks = getLinkedMentions(item);
      const subSuffix = entityMode === 'heroes' ? 'Faction' : 'Element';

      container.innerHTML = `
        <div class="nav-bar">
          <button class="back-btn" onclick="openGroup('${item.faction}')">← ${escapeHtml(item.faction)}</button>
          <div style="display:flex; gap:6px;">
            <button class="btn-small" style="color:#93c5fd;" onclick="openEntryModal('${item.id}')">Edit</button>
            <button class="btn-small" style="color:#f87171;" onclick="deleteEntry('${item.id}')">Delete</button>
          </div>
        </div>
        <div class="detail-card">
          <div class="detail-top">
            <div>
              <div class="detail-hero-name" style="color:${gColor}">${escapeHtml(item.name)}</div>
              <div class="detail-faction-label">${escapeHtml(item.faction)} ${subSuffix}</div>
            </div>
            <button class="star-toggle" onclick="toggleFav('${item.id}')" title="Favorite">${item.fav ? '⭐' : '☆'}</button>
          </div>
          <div class="info-block"><div class="info-label">🤝 Synergies</div><div class="info-content">${linkify(item.synergy, item.id)}</div></div>
          <div class="info-block"><div class="info-label">⚔️ Strong Against</div><div class="info-content">${linkify(item.strong, item.id)}</div></div>
          <div class="info-block"><div class="info-label">🛡️ Counters / Weak Against</div><div class="info-content">${linkify(item.counter, item.id)}</div></div>
          <div class="info-block"><div class="info-label">📝 Notes</div><div class="info-content">${linkify(item.notes, item.id)}</div></div>
          ${backLinks.length > 0 ? `
            <div class="info-block">
              <div class="info-label">🔗 Linked From Other ${entityMode === 'heroes' ? 'Heroes' : 'Titans'}</div>
              <div class="info-content">${backLinks.map(l => `
                <div class="backlink-row">
                  <span class="hero-link" style="color:${getGroupColor(l.item.faction)}" onclick="openDetail('${l.item.id}')">${escapeHtml(l.item.name)}</span>
                  <span class="backlink-tag"> — ${escapeHtml(l.label)}</span>
                </div>`).join('')}
              </div>
            </div>` : ''}
        </div>`;
    }
  }

  function openEntryModal(id = null) {
    document.getElementById('entryForm').reset();
    const groups = getActiveGroups();
    document.getElementById('groupInput').innerHTML = groups.map(g => `<option value="${g.id}">${g.id}</option>`).join('');
    document.getElementById('nameLabel').textContent = entityMode === 'heroes' ? 'Hero Name' : 'Titan Name';
    document.getElementById('groupLabel').textContent = entityMode === 'heroes' ? 'Faction' : 'Element';

    if (id) {
      const item = getActiveList().find(x => x.id === id);
      if (!item) return;
      document.getElementById('modalTitle').textContent = entityMode === 'heroes' ? 'Edit Hero' : 'Edit Titan';
      document.getElementById('editId').value = item.id;
      document.getElementById('nameInput').value = item.name;
      document.getElementById('groupInput').value = item.faction;
      document.getElementById('synergyInput').value = item.synergy || '';
      document.getElementById('strongInput').value = item.strong || '';
      document.getElementById('counterInput').value = item.counter || '';
      document.getElementById('notesInput').value = item.notes || '';
    } else {
      document.getElementById('modalTitle').textContent = entityMode === 'heroes' ? 'Add New Hero' : 'Add New Titan';
      document.getElementById('editId').value = '';
      if (viewMode === 'group' && activeGroup !== 'All' && activeGroup !== 'Favorites') {
        document.getElementById('groupInput').value = activeGroup;
      }
    }
    document.getElementById('entryModal').classList.add('open');
  }
  function closeModal() { document.getElementById('entryModal').classList.remove('open'); }
  function saveEntry(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const list = getActiveList();
    const existing = id ? list.find(x => x.id === id) : null;
    const obj = {
      id: id || (entityMode === 'heroes' ? 'h_' : 't_') + Date.now(),
      name: document.getElementById('nameInput').value.trim(),
      faction: document.getElementById('groupInput').value,
      fav: existing ? Boolean(existing.fav) : false,
      synergy: document.getElementById('synergyInput').value.trim(),
      strong: document.getElementById('strongInput').value.trim(),
      counter: document.getElementById('counterInput').value.trim(),
      notes: document.getElementById('notesInput').value.trim()
    };
    if (id) {
      const idx = list.findIndex(x => x.id === id);
      if (idx !== -1) list[idx] = obj;
    } else {
      list.push(obj);
    }
    activeEntryId = obj.id;
    viewMode = 'detail';
    saveCurrent();
    closeModal();
  }
  function deleteEntry(id) {
    const list = getActiveList();
    const item = list.find(x => x.id === id);
    if (item && confirm(`Delete ${item.name} from Codex?`)) {
      if (entityMode === 'heroes') heroes = heroes.filter(x => x.id !== id);
      else titans = titans.filter(x => x.id !== id);
      openGroup(item.faction);
      saveCurrent();
    }
  }
  function exportJSON() {
    const payload = { heroes, titans };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gaben-codex-backup.json'; a.click();
  }
  function importJSON(e) {
    const f = e.target.files; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const imp = JSON.parse(ev.target.result);
        if (Array.isArray(imp) && confirm(`Import ${imp.length} heroes?`)) {
          heroes = imp; localStorage.setItem(HEROES_KEY, JSON.stringify(heroes)); updateDatalist(); goHome();
        } else if (imp && (Array.isArray(imp.heroes) || Array.isArray(imp.titans))) {
          if (confirm(`Import ${(imp.heroes||[]).length} heroes and ${(imp.titans||[]).length} titans?`)) {
            if (Array.isArray(imp.heroes)) { heroes = imp.heroes; localStorage.setItem(HEROES_KEY, JSON.stringify(heroes)); }
            if (Array.isArray(imp.titans)) { titans = imp.titans; localStorage.setItem(TITANS_KEY, JSON.stringify(titans)); }
            updateDatalist(); goHome();
          }
        }
      } catch { alert('Invalid backup file.'); }
      e.target.value = '';
    };
    r.readAsText(f);
  }
  updateDatalist(); render();
</script>
</body>
</html>
